name: Build Ruby4Lich5 Installer (baked)

# Lives directly in elanthia-online/Ruby4Lich5, which owns installer builds.
# Builds the baked, non-DevKit installer: a stock
# RubyInstaller tree (installed via .exe with /components=ruby) with the
# precompiled binary gems gem-installed straight in on the runner (no MSYS2,
# no compile, no prune). The installer just lays that finished tree down --
# one app, file-copy fast. Compiles Ruby4Lich5-installer.iss with Inno Setup.
#
# Lich itself is NOT part of this build anymore -- Ruby4Lich5-installer.iss
# fetches it at install time instead (fetch-lich.ps1), matching how a new
# Lich release can land without a human pushing it through Ruby4Lich5's front
# door first ("one team, two repos" -- see docs/PUNCHLIST-remaining-work.md's
# Item 6 sections). There used to be a build_lich_payload job here that
# checked out Lich's source, zipped it, and fed it into this build -- retired
# together with the .iss change that stopped consuming it, not left as dead
# CI work alongside a design it no longer matches.

on:
  workflow_dispatch:
    inputs:
      gem-source:
        description: "Choose tested Actions artifacts or the immutable candidate referenced by the accepted manifest."
        type: choice
        options: [actions, accepted-candidate]
        default: actions
        required: true
      gem-candidate-tag:
        description: "Exact accepted candidate run/attempt tag. Required only for accepted-candidate; never a production tag."
        required: false
      gem-build-run-id:
        description: "Successful gem-suite Actions run ID. Required only for actions; leave blank for accepted-candidate."
        required: false
      ruby-series:
        description: "Ruby series (e.g. 4.0), required to match the tested artifact."
        required: false
        default: "4.0"
      installer-version:
        description: "Ruby4Lich5's own installer-build identity (AppVersion), shaped Ruby.Gems.CI (e.g. 040.001.002) -- independent of RubyVersion/GemBundleVersion, owned by Ruby4Lich5 (docs/DECISIONS.md Phase 1, item 4). See docs/PUNCHLIST-remaining-work.md's versioning section for what each field means and how it's derived; bump this per dispatch when cutting a real release."
        required: false
        default: "040.001.002"

permissions:
  contents: read
  actions: read

jobs:
  build_installer:
    name: Build installer (windows)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GEM_BUILD_RUN_ID: ${{ inputs.gem-build-run-id }}
      GEM_SOURCE: ${{ inputs.gem-source }}
      GEM_CANDIDATE_TAG: ${{ inputs.gem-candidate-tag }}
    steps:
      - name: Checkout installer assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/require-admin-dispatch

      - name: Validate explicit gem source
        shell: powershell
        run: |
          if ($env:GEM_SOURCE -ceq 'actions') {
            if ($env:GEM_BUILD_RUN_ID -cnotmatch '\A[1-9][0-9]*\z' -or $env:GEM_CANDIDATE_TAG) { throw 'Actions source requires a positive gem-build-run-id and no candidate tag.' }
          } elseif ($env:GEM_SOURCE -ceq 'accepted-candidate') {
            if ($env:GEM_BUILD_RUN_ID -or $env:GEM_CANDIDATE_TAG -cnotmatch '\AR4L5-gem-bundle-x64-mingw-ucrt-candidate-[1-9][0-9]*-[1-9][0-9]*\z') { throw 'Retained source requires only an exact gem-candidate-tag.' }
          } else { throw 'Choose gem-source=actions or accepted-candidate.' }
          "GEM_ACCEPTED_MANIFEST=$env:GITHUB_WORKSPACE/manifest/R4L5-gem-manifest.json" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Select tested gem artifact
        if: ${{ inputs.gem-source == 'actions' }}
        id: gem-artifact
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GEM_BUILD_RUN_ID -notmatch '\A[1-9][0-9]*\z') { throw 'gem-build-run-id must be a positive numeric Actions run ID.' }
          . (Join-Path $env:GITHUB_WORKSPACE 'gem-bundle-artifact.ps1')
          $runOutput = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GEM_BUILD_RUN_ID" 2>&1
          if ($LASTEXITCODE -ne 0) { throw "Could not read gem build run: $runOutput" }
          $run = $runOutput | ConvertFrom-Json
          Assert-GemBuildRun -Run $run -Repository $env:GITHUB_REPOSITORY -RunId $env:GEM_BUILD_RUN_ID
          $runOutput | Set-Content (Join-Path $env:RUNNER_TEMP 'gem-build-run.json') -Encoding utf8
          $artifactOutput = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GEM_BUILD_RUN_ID/artifacts?per_page=100" --paginate --slurp 2>&1
          if ($LASTEXITCODE -ne 0) { throw "Could not list gem build artifacts: $artifactOutput" }
          $pages = $artifactOutput | ConvertFrom-Json
          $artifacts = @($pages | ForEach-Object { $_.artifacts } | Where-Object { $_.name -eq 'ruby4-bundled-gems-windows-ucrt64' })
          if ($artifacts.Count -ne 1 -or $artifacts[0].expired) {
            throw 'Expected exactly one unexpired final tested gem artifact. Start a fresh gem-factory dispatch using Run workflow, wait for build and smoke to pass, then use the new run ID. Re-run failed jobs or Re-run all jobs on the old run may retain ambiguous artifacts.'
          }
          $artifact = $artifacts[0]
          if ($artifact.digest -cnotmatch '\Asha256:[0-9a-f]{64}\z') { throw 'Gem Actions artifact has no valid SHA-256 digest.' }
          "artifact-id=$($artifact.id)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "GEM_ARTIFACT_ID=$($artifact.id)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "GEM_ARTIFACT_DIGEST=$($artifact.digest)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Download tested gem artifact
        if: ${{ inputs.gem-source == 'actions' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.gem-artifact.outputs.artifact-id }}
          run-id: ${{ inputs.gem-build-run-id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: gembundle
          merge-multiple: true
          digest-mismatch: error

      - name: Download accepted candidate bundle
        if: ${{ inputs.gem-source == 'accepted-candidate' }}
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . (Join-Path $env:GITHUB_WORKSPACE 'verify-archive-download.ps1')
          . (Join-Path $env:GITHUB_WORKSPACE 'gem-candidate-publication.ps1')
          . (Join-Path $env:GITHUB_WORKSPACE 'gem-candidate-bundle.ps1')
          $live = (Invoke-CandidateGh -Arguments @('api', "repos/$env:GITHUB_REPOSITORY/releases/tags/R4L5-gem-bundle-x64-mingw-ucrt")) | ConvertFrom-Json
          if ($live.tag_name -cne 'R4L5-gem-bundle-x64-mingw-ucrt' -or $live.draft -ne $false) { throw 'Invalid accepted release.' }
          $manifest = @($live.assets | Where-Object { $_.name -ceq 'R4L5-gem-manifest.json' })
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/R4L5-gem-bundle-x64-mingw-ucrt/R4L5-gem-manifest.json"
          if ($manifest.Count -ne 1 -or $manifest[0].browser_download_url -cne $url) { throw 'Missing exact accepted manifest asset.' }
          $manifestPath = Join-Path $env:RUNNER_TEMP 'accepted-gem-manifest.json'
          Invoke-VerifiedDownload -Url $url -ExpectedDigest $manifest[0].digest -DestinationPath $manifestPath | Out-Null
          $releaseJson = Invoke-CandidateGh -Arguments @('api', "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:GEM_CANDIDATE_TAG")
          $releaseJson | Set-Content (Join-Path $env:RUNNER_TEMP 'gem-candidate-release.json') -Encoding utf8
          $selection = Resolve-AcceptedGemCandidate -Release ($releaseJson | ConvertFrom-Json) -AcceptedManifestPath $manifestPath `
            -Repository $env:GITHUB_REPOSITORY -Tag $env:GEM_CANDIDATE_TAG
          Invoke-VerifiedDownload -Url $selection.archive_url -ExpectedDigest $selection.archive_digest `
            -DestinationPath (Join-Path $env:RUNNER_TEMP 'accepted-gem-bundle.zip') | Out-Null
          "GEM_ACCEPTED_MANIFEST=$manifestPath" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "GEM_CANDIDATE_MANIFEST_DIGEST=$($selection.manifest_digest)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "GEM_CANDIDATE_ARCHIVE_DIGEST=$($selection.archive_digest)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify gem artifact identity and contents
        shell: powershell
        env:
          RUBY_SERIES_INPUT: ${{ inputs.ruby-series }}
        run: |
          . (Join-Path $env:GITHUB_WORKSPACE 'gem-bundle-artifact.ps1')
          if ($env:GEM_SOURCE -ceq 'actions') {
            $run = Get-Content (Join-Path $env:RUNNER_TEMP 'gem-build-run.json') -Raw | ConvertFrom-Json
            $metadata = Read-VerifiedGemBundle -Directory (Join-Path $PWD 'gembundle') -Run $run `
              -Repository $env:GITHUB_REPOSITORY -RunId $env:GEM_BUILD_RUN_ID -RubySeries $env:RUBY_SERIES_INPUT
          } else {
            . (Join-Path $env:GITHUB_WORKSPACE 'gem-candidate-bundle.ps1')
            $release = Get-Content (Join-Path $env:RUNNER_TEMP 'gem-candidate-release.json') -Raw | ConvertFrom-Json
            $metadata = Read-AcceptedGemCandidate -Release $release -AcceptedManifestPath $env:GEM_ACCEPTED_MANIFEST `
              -Repository $env:GITHUB_REPOSITORY -Tag $env:GEM_CANDIDATE_TAG -ArchivePath (Join-Path $env:RUNNER_TEMP 'accepted-gem-bundle.zip') `
              -Directory (Join-Path $PWD 'gembundle') -RubySeries $env:RUBY_SERIES_INPUT
          }
          "RUBY_INSTALLER_VERSION=$($metadata.ruby_installer_version)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "GEM_BUILD_RUBY_ARCHIVE_DIGEST=$($metadata.ruby_archive_digest)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "GEM_SOURCE_SHA=$($metadata.source_sha)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "GEM_BUILD_RUN_ID=$($metadata.run_id)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          if ($env:GEM_SOURCE -ceq 'actions') { $bundleVersion = "actions-run-$($metadata.run_id)-attempt-$($metadata.run_attempt)" }
          else { $bundleVersion = $env:GEM_CANDIDATE_TAG }
          "GEM_BUNDLE_VERSION=$bundleVersion" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Verified tested gems from $bundleVersion, source $($metadata.source_sha)."

      # GH_TOKEN is limited to steps that only call the GitHub API or download
      # artifacts. Steps that execute the downloaded RubyInstaller or gems
      # receive no token and no persisted credentials.
      - name: Resolve exact tested RubyInstaller
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $apiOutput = gh api "repos/oneclick/rubyinstaller2/releases/tags/RubyInstaller-$env:RUBY_INSTALLER_VERSION" 2>&1
          if ($LASTEXITCODE -ne 0) { throw "Could not resolve tested RubyInstaller: $apiOutput" }
          $rel = $apiOutput | ConvertFrom-Json
          if ($rel.tag_name -cne "RubyInstaller-$env:RUBY_INSTALLER_VERSION") { throw 'Wrong RubyInstaller release.' }
          $archive = @($rel.assets | Where-Object { $_.name -ceq "rubyinstaller-$env:RUBY_INSTALLER_VERSION-x64.7z" })
          if ($archive.Count -ne 1 -or $archive[0].digest -cne $env:GEM_BUILD_RUBY_ARCHIVE_DIGEST) {
            throw 'RubyInstaller archive identity changed since gem smoke.'
          }
          $exeName = "rubyinstaller-$env:RUBY_INSTALLER_VERSION-x64.exe"
          $assets = @($rel.assets | Where-Object { $_.name -ceq $exeName })
          if ($assets.Count -ne 1 -or $assets[0].digest -cnotmatch '\Asha256:[0-9a-f]{64}\z') { throw 'Missing or invalid tested installer executable digest.' }
          "RUBY_VERSION=$(($env:RUBY_INSTALLER_VERSION -split '-')[0])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "RUBY_EXE_URL=$($assets[0].browser_download_url)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "RUBY_EXE_DIGEST=$($assets[0].digest)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Ruby tree to .\ruby (no rdoc, no MSYS2 -- avoided, not stripped)
        shell: powershell
        run: |
          # /components is an allowlist (default ruby,rdoc,msys2). Passing only
          # 'ruby' never writes rdoc docs or the MSYS2 toolchain. Run on the
          # runner (throwaway registration); we ship the resulting tree, not the .exe.
          . (Join-Path $env:GITHUB_WORKSPACE 'verify-archive-download.ps1')
          try {
            Invoke-VerifiedDownload -Url $env:RUBY_EXE_URL -ExpectedDigest $env:RUBY_EXE_DIGEST -DestinationPath (Join-Path $PWD 'rubyinstaller.exe') | Out-Null
          } catch {
            Write-Error "RubyInstaller download/verification failed: $($_.Exception.Message)"
            exit 1
          }
          Write-Host "RubyInstaller digest verified: $env:RUBY_EXE_DIGEST"
          $ruby = Join-Path $PWD 'ruby'
          Start-Process -FilePath .\rubyinstaller.exe -Wait -ArgumentList `
            '/verysilent','/norestart','/currentuser',"/dir=$ruby",'/components=ruby','/tasks=nomodpath,noassocfiles,noridkinstall'
          if (!(Test-Path "$ruby\bin\ruby.exe")) { Write-Error "$ruby\bin\ruby.exe missing after install."; exit 1 }
          & "$ruby\bin\ruby.exe" -v
          if ($LASTEXITCODE -ne 0) { throw 'Installed Ruby could not run.' }
          $installedVersion = & "$ruby\bin\ruby.exe" -e 'print RUBY_VERSION'
          if ($LASTEXITCODE -ne 0 -or $installedVersion -cne $env:RUBY_VERSION) { throw 'Installed Ruby does not match the resolved version.' }

      - name: Check installer inventory against accepted recovery versions
        shell: powershell
        run: |
          $ruby = Join-Path $PWD 'ruby\bin\ruby.exe'
          & $ruby bin/check_installer_inventory.rb $env:GEM_ACCEPTED_MANIFEST gembundle
          if ($LASTEXITCODE -ne 0) { throw 'Installer inventory or sqlite3 ABI check failed; review version drift before baking.' }

      - name: Bake gems into the Ruby tree (gem install --local, no compile)
        shell: powershell
        run: |
          $rubyBin = Join-Path $PWD 'ruby\bin'
          $env:Path = "$rubyBin;$env:Path"
          # Install only the identity-checked artifact's ordered local files.
          $bundle  = (Get-ChildItem .\gembundle -Filter 'runtime-gems-install-targets.txt' -Recurse | Select-Object -First 1).Directory.FullName
          $targets = Get-Content (Join-Path $bundle 'runtime-gems-install-targets.txt') | Where-Object { $_.Trim() }
          Write-Host "Baking $($targets.Count) targets from $bundle"
          Push-Location $bundle
          $code = 0
          foreach ($target in $targets) {
            & "$rubyBin\gem.cmd" install --local --ignore-dependencies --no-document --force $target
            $code = $LASTEXITCODE
            if ($code -ne 0) { break }
          }
          Pop-Location
          if ($code -ne 0) { Write-Error "Gem bake failed (exit $code)."; exit $code }
          Write-Host "::group::Installed gems"
          & "$rubyBin\gem.cmd" list --local
          Write-Host "::endgroup::"

      - name: Smoke the baked tree (loads on the runner before we ship it)
        shell: powershell
        run: |
          $ruby = Join-Path $PWD 'ruby\bin\ruby.exe'
          & $ruby bin/smoke_runtime.rb gembundle/resolution-lock.json
          if ($LASTEXITCODE -ne 0) { Write-Error "Baked Ruby tree failed to load the runtime gems."; exit 1 }

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco feature disable -n=showDownloadProgress
          choco install -y --no-progress innosetup

      # LichVersion is deliberately not passed anymore -- Lich isn't baked in at
      # build time, so there's nothing to label; the .iss no longer even
      # defines that preprocessor variable (see its own header comment).
      - name: Compile installer
        shell: powershell
        env:
          INSTALLER_VERSION_INPUT: ${{ inputs.installer-version }}
        run: |
          # Read via $env:, not spliced into the ISCC argument text -- same
          # injection-safety reasoning as the gem-repo/gem-release-tag inputs
          # above.
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { Write-Error "ISCC not found at $iscc."; exit 1 }
          & $iscc "/DRubyVersion=$env:RUBY_VERSION" "/DGemBundleVersion=$env:GEM_BUNDLE_VERSION" "/DInstallerVersion=$env:INSTALLER_VERSION_INPUT" "Ruby4Lich5-installer.iss"
          if ($LASTEXITCODE -ne 0) { Write-Error "Inno Setup compile failed."; exit $LASTEXITCODE }
          if (!(Test-Path .\Output\Ruby4Lich5.exe)) { Write-Error "Output\Ruby4Lich5.exe not produced."; exit 1 }
          Get-Item .\Output\Ruby4Lich5.exe | ForEach-Object { Write-Host "Built: $($_.Name) ($([math]::Round($_.Length/1MB,1)) MB)" }

      - name: Recheck accepted predecessor before finalizing retained-source installer
        if: ${{ inputs.gem-source == 'accepted-candidate' }}
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . (Join-Path $env:GITHUB_WORKSPACE 'gem-candidate-publication.ps1')
          $live = (Invoke-CandidateGh -Arguments @('api', "repos/$env:GITHUB_REPOSITORY/releases/tags/R4L5-gem-bundle-x64-mingw-ucrt")) | ConvertFrom-Json
          $assets = @($live.assets | Where-Object { $_.name -ceq 'R4L5-gem-manifest.json' })
          if ($live.tag_name -cne 'R4L5-gem-bundle-x64-mingw-ucrt' -or $assets.Count -ne 1 -or $assets[0].digest -cne $env:GEM_CANDIDATE_MANIFEST_DIGEST) {
            throw 'Accepted manifest changed during the installer build; inspect the new accepted candidate before rebuilding.'
          }

      - name: Record installer provenance
        shell: powershell
        env:
          INSTALLER_VERSION_INPUT: ${{ inputs.installer-version }}
        run: |
          $provenance = [ordered]@{
            installer_version = $env:INSTALLER_VERSION_INPUT
            installer_source_sha = $env:GITHUB_SHA
            installer_run_id = $env:GITHUB_RUN_ID
            ruby_installer_version = $env:RUBY_INSTALLER_VERSION
            ruby_exe_digest = $env:RUBY_EXE_DIGEST
            gem_bundle_version = $env:GEM_BUNDLE_VERSION
            installer_sha256 = (Get-FileHash .\Output\Ruby4Lich5.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          if ($env:GEM_SOURCE -ceq 'actions') { $provenance.gem_source = 'actions-artifact' }
          else {
            $provenance.gem_source = 'accepted-candidate'
            $provenance.gem_candidate_tag = $env:GEM_CANDIDATE_TAG
            $provenance.gem_candidate_manifest_digest = $env:GEM_CANDIDATE_MANIFEST_DIGEST
            $provenance.gem_candidate_archive_digest = $env:GEM_CANDIDATE_ARCHIVE_DIGEST
          }
          $provenance.gem_repository = $env:GITHUB_REPOSITORY
          $provenance.gem_build_run_id = $env:GEM_BUILD_RUN_ID
          $provenance.gem_source_sha = $env:GEM_SOURCE_SHA
          $provenance.gem_artifact_id = $env:GEM_ARTIFACT_ID
          $provenance.gem_artifact_digest = $env:GEM_ARTIFACT_DIGEST
          Copy-Item .\gembundle\gem-build-metadata.json .\Output\
          Copy-Item .\gembundle\resolution-lock.json .\Output\
          $provenance | ConvertTo-Json -Depth 4 | Set-Content .\Output\installer-provenance.json -Encoding utf8
          @(
            '## Installer built (verified tested source)',
            "RubyInstaller: $env:RUBY_INSTALLER_VERSION",
            "Gems: $env:GEM_BUNDLE_VERSION",
            "Installer SHA-256: $($provenance.installer_sha256)",
            'See installer-provenance.json alongside Ruby4Lich5.exe for exact source and digest records.'
          ) | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ruby4lich5-installer
          path: .\Output\*
          retention-days: 90
          if-no-files-found: error
