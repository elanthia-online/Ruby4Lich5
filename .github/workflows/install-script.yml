# Tests the macOS/Linux install script (site/install.sh) on real runners and
# containers, then publishes site/ to GitHub Pages
# (https://ruby4lich5.elanthia.online/install.sh).
#
# Runs only when site/ or this workflow changes. Pull requests run the tests;
# a push to main runs the tests and, only if every test passes, publishes.
name: Install script

on:
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/install-script.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/install-script.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: install-script-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint install.sh
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Syntax check and ShellCheck
        run: |
          bash -n site/install.sh
          shellcheck --version
          shellcheck -s bash site/install.sh

  test:
    name: ${{ matrix.name }}
    needs: lint
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'Ubuntu 24.04',                runner: ubuntu-24.04,     shell: /bin/bash }
          - { name: 'Ubuntu 22.04',                runner: ubuntu-22.04,     shell: /bin/bash }
          - { name: 'Ubuntu 24.04 ARM',            runner: ubuntu-24.04-arm, shell: /bin/bash }
          - { name: 'Ubuntu 24.04 (--no-gtk)',     runner: ubuntu-24.04,     shell: /bin/bash, args: '--no-gtk' }
          - { name: 'Ubuntu 26.04 (container)',    runner: ubuntu-24.04,     shell: /bin/bash, container: 'ubuntu:26.04' }
          - { name: 'Debian 12 / Chromebook',      runner: ubuntu-24.04,     shell: /bin/bash, container: 'debian:12' }
          - { name: 'Debian 13',                   runner: ubuntu-24.04,     shell: /bin/bash, container: 'debian:13' }
          - { name: 'Fedora 43',                   runner: ubuntu-24.04,     shell: /bin/bash, container: 'fedora:43' }
          - { name: 'Arch Linux',                  runner: ubuntu-24.04,     shell: /bin/bash, container: 'archlinux:latest' }
          - { name: 'macOS 15 (Apple Silicon)',    runner: macos-15,         shell: /bin/zsh }
          - { name: 'macOS 15 (Intel)',            runner: macos-15-intel,   shell: /bin/zsh }
          - { name: 'macOS 26',                    runner: macos-26,         shell: /bin/zsh }
    env:
      # The user's login shell decides which startup file the script edits.
      SHELL: ${{ matrix.shell }}
      ARGS: ${{ matrix.args }}
    defaults:
      run:
        shell: bash
    steps:
      # Containers start bare. Give them what any desktop install already has:
      # bash, curl and tar (the script installs everything else itself).
      - name: Prepare container
        if: ${{ matrix.container != '' }}
        shell: sh
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update && apt-get install -y --no-install-recommends bash curl ca-certificates
          elif command -v dnf >/dev/null; then
            dnf install -y bash curl tar gzip findutils
          elif command -v pacman >/dev/null; then
            pacman -Sy --noconfirm --needed bash curl tar gzip
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install, piped into bash as users run it
        run: |
          # shellcheck disable=SC2086
          cat site/install.sh | bash -s -- --yes $ARGS 2>&1 | tee install-1.log

      - name: Check Lich and Ruby from a fresh login shell
        run: |
          if [ "$(uname -s)" = Darwin ]; then lich="$HOME/Desktop/Lich5"; else lich="$HOME/Lich5"; fi
          groups=':default, :profanity, :gtk'
          [ "$ARGS" = '--no-gtk' ] && groups=':default, :profanity'
          cat > "$RUNNER_TEMP/check.sh" <<EOF
          set -e
          cd "$lich"
          echo "ruby: \$(command -v ruby)"
          ruby -v
          ruby -v | grep -q '^ruby 4\.'
          ruby lich.rbw --version | head -n 1
          ruby -I lib -e 'require "gemcheck"; m = Lich::GemCheck.missing_gems([$groups]); abort("Lich GemCheck: missing #{m.join(", ")}") unless m.empty?; puts "Lich GemCheck: all gems present"'
          EOF
          # A new terminal window: no CI environment, only what the startup files set up.
          # macOS Terminal opens login shells (zsh -l runs path_helper); Linux terminals open interactive ones.
          clean_env=(env -i HOME="$HOME" USER="$(id -un)" TERM=dumb SHELL="$SHELL" LANG=C.UTF-8 PATH=/usr/bin:/bin:/usr/sbin:/sbin)
          if [ "$(basename "$SHELL")" = zsh ]; then
            "${clean_env[@]}" zsh -lic "source '$RUNNER_TEMP/check.sh'"
          else
            "${clean_env[@]}" bash -ic "source '$RUNNER_TEMP/check.sh'"
          fi

      - name: Run again (upgrade path) and check nothing is duplicated
        run: |
          if [ "$(uname -s)" = Darwin ]; then lich="$HOME/Desktop/Lich5"; else lich="$HOME/Lich5"; fi
          touch "$lich/marker-from-ci"
          # shellcheck disable=SC2086
          cat site/install.sh | bash -s -- --yes $ARGS 2>&1 | tee install-2.log
          grep -q 'existing install: left as is' install-2.log
          grep -q 'Ruby .* is already installed' install-2.log
          test -f "$lich/marker-from-ci"
          case "$(basename "$SHELL")" in
            zsh)  rc="$HOME/.zshrc" ;;
            bash) if [ "$(uname -s)" = Darwin ]; then rc="$HOME/.bash_profile"; else rc="$HOME/.bashrc"; fi ;;
          esac
          blocks=$(grep -c 'added by the Ruby4Lich5 installer' "$rc" || true)
          echo "rbenv blocks in $rc: $blocks"
          [ "$blocks" -le 1 ]

      - name: Keep logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-logs-${{ strategy.job-index }}
          path: install-*.log
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish to GitHub Pages
    needs: test
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
