name: Pester Tests
on:
  push:
    branches:
      - main
    paths:
      - "**/*.ps1"
      - "spec/powershell/**"
      - ".github/workflows/ruby4-bundled-gems-suite.yml"
  pull_request:
    paths:
      - "**/*.ps1"
      - "spec/powershell/**"
      - ".github/workflows/ruby4-bundled-gems-suite.yml"

permissions:
  contents: read

jobs:
  pester:
    runs-on: windows-latest
    name: Run Pester tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Pester 6.0.0
        shell: pwsh
        run: |
          Install-Module -Name Pester -RequiredVersion 6.0.0 -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Run Pester tests
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 6.0.0 -Force
          $config = New-PesterConfiguration
          $config.Run.Path = 'spec/powershell'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

      - name: Check candidate and installer handoff on Windows PowerShell 5.1
        shell: powershell
        run: |
          if ($PSVersionTable.PSEdition -ne 'Desktop' -or $PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) {
            throw 'This regression requires Windows PowerShell Desktop 5.1.'
          }
          Install-Module -Name Pester -RequiredVersion 6.0.0 -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -RequiredVersion 6.0.0 -Force
          $config = New-PesterConfiguration
          $config.Run.Path = @('spec/powershell/gem-candidate-publication.Tests.ps1', 'spec/powershell/runtime-build-tooling.Tests.ps1', 'spec/powershell/gem-bundle-artifact.Tests.ps1', 'spec/powershell/gem-candidate-bundle.Tests.ps1')
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config
