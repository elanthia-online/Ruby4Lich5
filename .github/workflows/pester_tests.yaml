name: Pester Tests
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  pester:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    name: Run Pester tests (${{ matrix.shell }})
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby for Windows publication smoke
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          bundler: none
          bundler-cache: false

      - name: Verify pinned Ruby on Windows PowerShell 5.1
        shell: powershell
        run: |
          $expected = (Get-Content .ruby-version -Raw).Trim()
          $actual = & ruby -e 'print RUBY_VERSION'
          if ($LASTEXITCODE -ne 0 -or $actual -cne $expected) {
            throw "Expected Ruby $expected from setup-ruby; got $actual."
          }

      - name: Install Pester 6.0.0
        run: |
          Install-Module -Name Pester -RequiredVersion 6.0.0 -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Run Pester tests
        env:
          PESTER_SHELL: ${{ matrix.shell }}
        run: |
          if ($env:PESTER_SHELL -eq 'powershell' -and
              ($PSVersionTable.PSEdition -ne 'Desktop' -or $PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1)) {
            throw 'The powershell lane must run Windows PowerShell 5.1.'
          }
          if ($env:PESTER_SHELL -eq 'pwsh' -and
              ($PSVersionTable.PSEdition -ne 'Core' -or $PSVersionTable.PSVersion.Major -lt 7)) {
            throw 'The pwsh lane must run PowerShell Core 7 or newer.'
          }
          Write-Host "Pester runtime: $($PSVersionTable.PSEdition) $($PSVersionTable.PSVersion)"
          Import-Module Pester -RequiredVersion 6.0.0 -Force
          $config = New-PesterConfiguration
          $config.Run.Path = 'spec/powershell'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

  pester_required:
    name: Run Pester tests
    needs: pester
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require both shell lanes
        env:
          PESTER_RESULT: ${{ needs.pester.result }}
        run: test "$PESTER_RESULT" = success
