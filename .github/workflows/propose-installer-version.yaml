# Propose from checksummed installer provenance and the accepted runtime contract.
# Missing historical provenance produces an explicit unavailable notice.
name: Propose Installer Version

on:
  pull_request:
    paths:
      - "Ruby4Lich5-installer.iss"
      - "fetch-lich.ps1"
      - "update-ruby-path.ps1"
      - "config/target-ruby.json"
      - "bin/record_installer_contract.rb"
      - ".github/workflows/build-ruby4lich5-installer.yaml"
      - ".github/workflows/propose-installer-version.yaml"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Derive and propose the next R4L5-v triple
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // Proposals run only for an administrator's own PR action or rerun.
            const actors = new Set([context.actor, process.env.GITHUB_TRIGGERING_ACTOR || context.actor]);
            for (const username of actors) {
              const result = await github.rest.repos.getCollaboratorPermissionLevel({...context.repo, username});
              if (result.data.permission !== 'admin') {
                core.notice('Version proposal skipped: both action and rerun actors must be administrators.');
                return;
              }
            }
            if (context.payload.pull_request.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.notice('Version proposal skipped for an external repository.');
              return;
            }
            const fs = require('fs');
            const crypto = require('crypto');
            const {owner, repo} = context.repo;
            const prNumber = context.payload.pull_request.number;
            const headSha = context.payload.pull_request.head.sha;
            const MARKER = '<!-- r4l5-version-proposal -->';
            const HEX = /^[0-9a-f]{64}$/;
            const SHA = /^[0-9a-f]{40}$/;
            const TAG = /^R4L5-v(\d{3})\.(\d{3})\.(\d{3})$/;
            class Unavailable extends Error {}
            const digest = bytes => crypto.createHash('sha256').update(bytes).digest('hex');
            function canonical(value) {
              if (Array.isArray(value)) return value.map(canonical);
              if (value && typeof value === 'object') return Object.fromEntries(Object.keys(value).sort().map(key => [key, canonical(value[key])]));
              return value;
            }
            function oneAsset(release, name, optional = false) {
              const assets = release.assets.filter(asset => asset.name === name);
              if (optional && assets.length === 0) throw new Unavailable(`${release.tag_name} has no ${name}; publish a provenance-bearing installer before comparing versions.`);
              if (assets.length !== 1) throw new Error(`Expected exactly one ${name} on ${release.tag_name}.`);
              if (!/^sha256:[0-9a-f]{64}$/.test(assets[0].digest || '')) throw new Error(`${name} has a missing or malformed digest.`);
              return assets[0];
            }
            async function document(release, name, optional = false) {
              const asset = oneAsset(release, name, optional);
              const expected = `https://github.com/${owner}/${repo}/releases/download/${release.tag_name}/${name}`;
              if (asset.browser_download_url !== expected) throw new Error(`Unexpected download URL for ${name}.`);
              const signal = AbortSignal.timeout(30000);
              let bytes;
              try {
                let url = expected;
                for (let redirects = 0; redirects <= 5; redirects++) {
                  const response = await fetch(url, {signal, redirect: 'manual'});
                  if ([301, 302, 303, 307, 308].includes(response.status)) {
                    const next = new URL(response.headers.get('location'), url);
                    await response.body?.cancel();
                    if (next.protocol !== 'https:' || next.username || next.password) throw new Error('Unsafe asset redirect.');
                    url = next.href;
                    continue;
                  }
                  if (!response.ok) throw new Unavailable(`Could not download ${name}: HTTP ${response.status}.`);
                  const chunks = [];
                  let size = 0;
                  for await (const chunk of response.body) {
                    size += chunk.length;
                    if (size > 5 * 1024 * 1024) { throw new Error(`${name} exceeds size limit.`); }
                    chunks.push(chunk);
                  }
                  bytes = Buffer.concat(chunks);
                  break;
                }
                if (!bytes) throw new Unavailable(`Too many redirects downloading ${name}.`);
              } catch (error) {
                if (error instanceof Unavailable || /Unsafe asset redirect|exceeds size limit/.test(error.message)) throw error;
                throw new Unavailable(`Could not read ${name}: ${error.message}`);
              }
              if (digest(bytes) !== asset.digest.slice(7)) throw new Error(`${name} SHA-256 does not match release metadata.`);
              let data;
              try { data = JSON.parse(bytes.toString('utf8')); } catch { throw new Error(`${name} is not valid JSON.`); }
              if (!data || Array.isArray(data) || typeof data !== 'object') throw new Error(`${name} must contain an object.`);
              return {data, sha256: digest(bytes)};
            }
            function increment(value) {
              const next = Number(value) + 1;
              if (next > 999) throw new Error('Version counter overflow; owner decision required.');
              return String(next).padStart(3, '0');
            }
            const target = JSON.parse(fs.readFileSync('config/target-ruby.json', 'utf8'));
            if (!/^\d+\.\d+\.\d+-\d+$/.test(target.ruby_installer_version || '') || !/^\d+\.\d+$/.test(target.ruby_abi || '')) throw new Error('Invalid target Ruby configuration.');
            if (!target.ruby_installer_version.startsWith(`${target.ruby_abi}.`)) throw new Error('Target Ruby version and ABI disagree.');
            const rubyField = target.ruby_abi.replace('.', '').padStart(3, '0');
            if (!/^\d{3}$/.test(rubyField)) throw new Error('Ruby field exceeds the installer version format.');
            let proposedTag = null, rationale;
            try {
              const releases = await github.paginate(github.rest.repos.listReleases, {owner, repo, per_page: 100});
              const installers = releases.filter(r => !r.draft && !r.prerelease && TAG.test(r.tag_name))
                .sort((a, b) => a.tag_name.localeCompare(b.tag_name));
              const latest = installers.at(-1);
              if (!latest) {
                proposedTag = `R4L5-v${rubyField}.001.002`;
                rationale = 'No prior installer release exists. Using the documented bootstrap counters: Gems 001, CI 002.';
              } else {
                const {data: provenance} = await document(latest, 'installer-provenance.json', true);
                const required = ['installer_version', 'installer_source_sha', 'ruby_installer_version', 'installer_sha256', 'runtime_contract_sha256', 'recovery_manifest_sha256'];
                if (required.some(key => !Object.hasOwn(provenance, key))) throw new Unavailable(`${latest.tag_name} predates complete installer contract provenance; no version is inferred.`);
                if (!required.every(key => typeof provenance[key] === 'string') || `R4L5-v${provenance.installer_version}` !== latest.tag_name || !SHA.test(provenance.installer_source_sha) || !/^\d+\.\d+\.\d+-\d+$/.test(provenance.ruby_installer_version) ||
                    !['installer_sha256', 'runtime_contract_sha256', 'recovery_manifest_sha256'].every(key => HEX.test(provenance[key]))) throw new Error('Invalid installer provenance fields.');
                const executable = oneAsset(latest, 'Ruby4Lich5.exe');
                if (executable.digest !== `sha256:${provenance.installer_sha256}`) throw new Error('Installer executable digest disagrees with provenance.');
                const accepted = (await github.rest.repos.getReleaseByTag({owner, repo, tag: 'R4L5-gem-bundle-x64-mingw-ucrt'})).data;
                if (accepted.tag_name !== 'R4L5-gem-bundle-x64-mingw-ucrt' || accepted.draft || accepted.prerelease) throw new Error('Invalid accepted recovery release.');
                const manifest = await document(accepted, 'R4L5-gem-manifest.json');
                if (manifest.data.schema !== 1 || !Array.isArray(manifest.data.targets)) throw new Error('Invalid accepted recovery manifest.');
                const targets = manifest.data.targets.filter(t => t.platform === target.platform && t.ruby_abi === target.ruby_abi);
                if (targets.length !== 1 || !targets[0].contract || typeof targets[0].contract !== 'object' || Array.isArray(targets[0].contract) || targets[0].contract.schema !== 1 || targets[0].contract.promotable !== true || !Array.isArray(targets[0].units) || targets[0].units.length === 0) throw new Error('Accepted recovery manifest has no unique target contract.');
                const contractDigest = digest(JSON.stringify(canonical(targets[0].contract)));
                const gemsChanged = provenance.recovery_manifest_sha256 !== manifest.sha256 || provenance.runtime_contract_sha256 !== contractDigest;
                const cmp = await github.rest.repos.compareCommits({owner, repo, base: provenance.installer_source_sha, head: headSha});
                if (!Array.isArray(cmp.data.files) || cmp.data.files.length >= 300) throw new Unavailable('Installer source comparison is incomplete; no version is inferred.');
                const inputs = new Set(['Ruby4Lich5-installer.iss', 'fetch-lich.ps1', 'update-ruby-path.ps1', 'config/target-ruby.json',
                  'bin/record_installer_contract.rb', '.github/workflows/build-ruby4lich5-installer.yaml']);
                const ciChanged = provenance.ruby_installer_version !== target.ruby_installer_version || cmp.data.files.some(f => inputs.has(f.filename) || inputs.has(f.previous_filename));
                const [, oldRuby, oldGems, oldCi] = latest.tag_name.match(TAG);
                const rubyChanged = rubyField !== oldRuby;
                const gemsField = gemsChanged ? increment(oldGems) : oldGems;
                const ciField = ciChanged ? increment(oldCi) : oldCi;
                if (rubyChanged || gemsChanged || ciChanged) {
                  proposedTag = `R4L5-v${rubyField}.${gemsField}.${ciField}`;
                  const reasons = [];
                  if (rubyChanged) reasons.push(`Ruby ${oldRuby} -> ${rubyField} (target Ruby ABI changed)`);
                  if (gemsChanged) reasons.push(`Gems ${oldGems} -> ${gemsField} (accepted recovery manifest or runtime contract changed)`);
                  if (ciChanged) reasons.push(`CI ${Number(oldCi)} -> ${Number(ciField)} (installer inputs or exact RubyInstaller version changed)`);
                  rationale = `Compared with verified installer provenance from ${latest.tag_name}:\n${reasons.map(r => `- ${r}`).join('\n')}`;
                } else {
                  rationale = `No change detected against verified installer provenance from ${latest.tag_name}. No version bump proposed.`;
                }
              }
            } catch (error) {
              // Missing historical provenance and transient API failures are explicit gaps.
              // Integrity/schema errors remain failures; no ZIP or release-note fallback.
              if (!(error instanceof Unavailable) && !error.status && !/rate limit|network|fetch failed/i.test(error.message)) throw error;
              core.warning(error.message);
              rationale = `Version proposal unavailable: ${error.message}`;
            }
            const body = `${MARKER}\n### Proposed next installer version\n\n` + (proposedTag
              ? `**\`${proposedTag}\`**\n\n${rationale}\n\nUse \`${proposedTag.slice(6)}\` for a reviewed installer dispatch. This is a proposal only.`
              : rationale);
            const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number: prNumber, per_page: 100});
            const existing = comments.find(c => c.user?.login === 'github-actions[bot]' && c.body?.includes(MARKER));
            if (existing) await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
            else await github.rest.issues.createComment({owner, repo, issue_number: prNumber, body});
