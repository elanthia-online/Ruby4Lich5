# Operator runbook: docs/RELEASING.md (one-time setup, cutting a release, failure recovery).
name: Release Ruby4Lich5 installer
run-name: Release installer ${{ inputs.installer-version }}

on:
  workflow_dispatch:
    inputs:
      lich5-commit:
        description: Full reviewed Lich candidate SHA owning the dependency contract.
        required: true
      installer-version:
        description: New installer identity NNN.NNN.NNN; never reuse a published version.
        required: true

permissions:
  contents: read
  actions: read

# One coordinator at a time; do not cancel a run waiting for acceptance.
concurrency:
  group: r4l5-release-coordinator
  cancel-in-progress: false
  queue: max

jobs:
  preflight_version:
    name: Reject occupied installer versions before candidate work
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Draft listings require write visibility; the dispatch PAT stays Contents read.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/require-admin-dispatch
        with:
          default-branch-only: 'true'
      - name: Check draft and tag identities with the job credential
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const {InstallerRelease} = require('./.github/scripts/installer-release.cjs');
            await new InstallerRelease({github, context, core}).preflightVersion(context.payload.inputs['installer-version']);

  prepare:
    name: Build candidate and inspect exact changes
    needs: preflight_version
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/require-admin-dispatch
        with:
          default-branch-only: 'true'
      - name: Build and inspect with the administrator dispatch credential
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.RELEASE_DISPATCH_TOKEN }}
          script: |
            const {InstallerRelease} = require('./.github/scripts/installer-release.cjs');
            await new InstallerRelease({github, context, core}).prepare(context.payload.inputs);
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-request
          path: release-request.json
          retention-days: 90
          if-no-files-found: error

  promote_and_build:
    name: Approve recovery promotion, then build installer draft
    needs: prepare
    environment: r4l5-recovery-promotion
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/require-admin-dispatch
        with:
          default-branch-only: 'true'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-request
          digest-mismatch: error
      - name: Use approved inspection and assemble installer draft
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.RELEASE_DISPATCH_TOKEN }}
          script: |
            const fs = require('node:fs');
            const {InstallerRelease} = require('./.github/scripts/installer-release.cjs');
            const request = JSON.parse(fs.readFileSync('release-request.json', 'utf8'));
            await new InstallerRelease({github, context, core}).promote(request);
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: approved-installer-draft
          path: installer-release-receipt.json
          retention-days: 90
          if-no-files-found: error

  approve_latest:
    name: Approve installation and restart acceptance
    needs: promote_and_build
    environment: r4l5-installer-latest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Do not acquire the shared manifest lock during the acceptance wait.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/require-admin-dispatch
        with:
          default-branch-only: 'true'
      - name: Verify recorded administrator acceptance
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const {InstallerRelease} = require('./.github/scripts/installer-release.cjs');
            await new InstallerRelease({github, context, core}).approval('r4l5-installer-latest');

  publish_latest:
    name: Publish approved unchanged draft as Latest
    needs: approve_latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: gem-manifest-promotion-x64-mingw-ucrt
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/require-admin-dispatch
        with:
          default-branch-only: 'true'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: approved-installer-draft
          digest-mismatch: error
      - name: Publish only approved unchanged bytes and verify Latest
        timeout-minutes: 17
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            const {InstallerRelease} = require('./.github/scripts/installer-release.cjs');
            const receipt = JSON.parse(fs.readFileSync('installer-release-receipt.json', 'utf8'));
            await new InstallerRelease({github, context, core}).publish(receipt);
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-installer-receipt
          path: |
            installer-release-receipt.json
            publication-status.json
          retention-days: 90
          if-no-files-found: error
